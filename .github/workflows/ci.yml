# Install + typecheck + official trust-manifest fetch.
# Do NOT run src/quickstart.ts — that is a live T3N handshake and needs a local key.
name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:card
      - run: npm run check:trust
